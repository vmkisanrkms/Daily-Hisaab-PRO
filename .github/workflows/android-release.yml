
name: Daily Hisaab PRO Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -path './.git' -prune -o \
            -path './.gradle' -prune -o \
            -type f \
            \( -name settings.gradle \
               -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find . -maxdepth 3 \
              -type f -iname '*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Gradle project or ZIP not found."
              echo "Upload the extracted Android project files."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/project"

            SETTINGS="$(find "$RUNNER_TEMP/project" \
              -type f \
              \( -name settings.gradle \
                 -o -name settings.gradle.kts \) \
              -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app directory not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "::error::App Gradle build file missing."
            exit 1
          fi

          echo "Project files verified."
          gradle --version

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          APK="$(find "$APK_DIR" -maxdepth 1 \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Daily-Hisaab-PRO-release.apk"

          cd "$GITHUB_WORKSPACE/release"
          sha256sum Daily-Hisaab-PRO-release.apk \
            > SHA256SUMS.txt

          echo "APK generated successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Hisaab-PRO-Release-APK
          path: |
            release/Daily-Hisaab-PRO-release.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
