
name: Facebook Video Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: video-downloader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find "$GITHUB_WORKSPACE" \
            -type d \( -name .git -o -name .gradle -o -name build \) -prune -o \
            \( -type f -name settings.gradle.kts \
            -o -type f -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -d "$PROJECT_DIR/app"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate and verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -s gradlew ] || \
             [ ! -s gradle/wrapper/gradle-wrapper.jar ] || \
             [ ! -s gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper \
              --gradle-version 8.9 \
              --distribution-type bin
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --version

      - name: Run tests and build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace \
            clean test assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Facebook-Video-Downloader.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$GITHUB_WORKSPACE/release/Facebook-Video-Downloader.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/Facebook-Video-Downloader.apk" \
            > "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Video-Downloader-APK
          path: |
            release/Facebook-Video-Downloader.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-Build-Logs
          path: |
            **/build/reports/tests/**
            **/build/reports/problems/**
            **/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
