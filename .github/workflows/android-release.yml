
name: Majdoor Hisaab PRO Phase 45 - Final Kotlin Workflow Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-phase45-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_SALARY_EMPLOYEE_V9.zip"
  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"
  APK_NAME: "Majdoor-Hisaab-PRO-PHASE45-RELEASE.apk"

jobs:
  build-release:
    name: Build and sign Phase 45 Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and verify source ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          selected="$ZIP_NAME"

          if [ ! -f "$selected" ]; then
            mapfile -t archives < <(
              find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort
            )

            if [ "${#archives[@]}" -eq 1 ]; then
              selected="${archives[0]}"
              echo "Using the only root ZIP: $selected"
            else
              echo "::error::Could not uniquely select source ZIP."
              printf '%s\n' "${archives[@]}"
              exit 1
            fi
          fi

          unzip -t "$selected"
          sha256sum "$selected"
          echo "zip_name=$selected" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses \
            >/dev/null 2>&1 || true

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-source
          unzip -q "${{ steps.archive.outputs.zip_name }}" -d build-source

          GRADLEW="$(
            find build-source -type f \
              -path '*/original_source_project/mhp/gradlew' \
              -not -path '*/.gradle/*' | sort | head -1
          )"

          if [ -z "$GRADLEW" ]; then
            GRADLEW="$(
              find build-source -type f -name gradlew \
                -not -path '*/.gradle/*' | sort | head -1
            )"
          fi

          if [ -z "$GRADLEW" ]; then
            echo "::error::No Gradle wrapper found inside source ZIP."
            find build-source -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_ROOT"

      - name: Run source regression audits
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts_redesign_phase2_static_audit.py
          python scripts_phase27_requested_ui_fixes_audit.py
          python scripts_phase45_handover_audit.py
          python scripts_phase29_fandi_labour_quick_entry_audit.py
          python scripts_phase28_drive_backup_feedback_audit.py
          python scripts_redesign_phase4_ui_audit.py
          python scripts_redesign_phase5_attendance_audit.py
          python scripts_redesign_phase6_worker_ledger_audit.py
          python scripts_redesign_phase7_data_safety_audit.py
          python scripts_redesign_phase8_batch_fixes_audit.py
          python scripts_redesign_phase9_remaining_audit.py
          python scripts_date_field_report_audit.py
          python scripts_report_k03_k04_audit.py
          python scripts_redesign_phase11_launch_security_audit.py
          python scripts_redesign_phase12_attendance_bulk_calendar_audit.py
          python scripts_redesign_phase13_work_wages_profitability_audit.py
          python scripts_redesign_phase14_reports_pdf_audit.py
          python scripts_redesign_phase15_l07_field_detail_audit.py
          python scripts_redesign_phase16_settings_security_audit.py
          python scripts_redesign_phase17_accounting_integrity_audit.py
          python scripts_redesign_phase18_ganna_chhilai_audit.py
          python scripts_redesign_phase19_ganna_parchi_audit.py
          python scripts_redesign_phase20_backup_restore_audit.py
          python scripts_need_remote_consent_static_check.py
          python scripts_redesign_phase21_shared_ui_audit.py
          python scripts_phase23_remaining_master_audit.py
          python scripts_phase24_five_remaining_points_audit.py
          python scripts_gradle_wrapper_bootstrap_audit.py

      - name: Provision Gradle for wrapper generation
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Bootstrap and verify Gradle Wrapper JAR
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-gradle-wrapper.sh
          ./gradlew --version

      - name: Compile Release Kotlin
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace

      - name: Run accounting regression unit tests
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Validate required permanent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/release-signing"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$RUNNER_TEMP/release-signing/release.jks"

          test -s "$RUNNER_TEMP/release-signing/release.jks"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/release-signing/release.jks" \
            >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$RUNNER_TEMP/release-signing/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Permanent keystore and alias validated."

      - name: Print permanent Release SHA-1
        shell: bash
        run: |
          set -euo pipefail

          echo "Signing certificate SHA-1:"
          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" |
            grep -E 'SHA1:|SHA-1:'

      - name: Assemble Release APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          ./gradlew :app:clean :app:assembleRelease \
            --no-daemon --stacktrace

      - name: Validate APK package, signature and alignment
        id: validate_apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/release \
              -type f -name '*.apk' \
              -not -name '*androidTest*' | sort | head -1
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          PACKAGE="$(
            "$AAPT" dump badging "$APK" |
              sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
              head -1
          )"

          if [ "$PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Expected package $EXPECTED_PACKAGE but found $PACKAGE"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "Release APK certificate details:"
          "$APKSIGNER" verify --print-certs "$APK"

          mkdir -p final
          cp "$APK" "final/$APK_NAME"
          echo "apk_path=final/$APK_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "final/$APK_NAME"
          ls -lh "final/$APK_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-PHASE45-RELEASE
          path: ${{ steps.project.outputs.root }}/${{ steps.validate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
