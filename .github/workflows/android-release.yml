name: Daily Hisaab PRO Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for CANDIDATE in \
              /usr/local/lib/android/sdk \
              /opt/android-sdk \
              "$HOME/Android/Sdk"; do
              if [ -d "$CANDIDATE" ]; then
                SDK="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK found at $SDK"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          yes | "$SDKMANAGER" --licenses || true

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo "Android SDK verification passed."

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          find_settings() {
            find "$1" \
              -type d \( -name .git -o -name .gradle \
                -o -name build \) -prune -o \
              -type f \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
              -print -quit
          }

          SETTINGS="$(find_settings "$GITHUB_WORKSPACE")"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 5 -type f -iname '*.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Android project or ZIP not found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/daily-hisaab-project"
            unzip -q "$ZIP_FILE" \
              -d "$RUNNER_TEMP/daily-hisaab-project"

            SETTINGS="$(find_settings \
              "$RUNNER_TEMP/daily-hisaab-project")"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app directory not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --version

          test -f settings.gradle || \
            test -f settings.gradle.kts

          echo "Gradle project verification passed."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean assembleRelease

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/daily-hisaab-signing"
          mkdir -p "$SIGN_DIR"
          chmod 700 "$SIGN_DIR"

          KEYSTORE="$SIGN_DIR/release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Keystore file is empty."
            exit 1
          fi

          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"
          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Keystore file prepared."

      - name: Align, sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -maxdepth 1 \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          ALIGNED="$RUNNER_TEMP/Daily-Hisaab-PRO-aligned.apk"
          SIGNED="$GITHUB_WORKSPACE/release/Daily-Hisaab-PRO.apk"

          "$TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED"

          "$TOOLS/zipalign" -c -p 4 "$SIGNED"

          cd "$GITHUB_WORKSPACE/release"
          sha256sum Daily-Hisaab-PRO.apk > SHA256SUMS.txt

          echo "Signed APK verified successfully."

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Hisaab-PRO-Signed-Release-APK
          path: |
            release/Daily-Hisaab-PRO.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
